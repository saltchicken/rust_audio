[package]
name = "wavetable_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
clack-plugin = "0.1"
plugin_core = { path = "../../core" }
serde = { version = "1.0", features = ["derive"] }
hound = "3.5"

[[bin]]
name = "generate_table"
path = "src/bin/generate_table.rs"
