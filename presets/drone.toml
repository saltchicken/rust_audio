[[track]]
name = "Drone Sub-Bass"
midi_channel = 9
plugin_chain = [
  "target/release/libdrone_plugin.so",
  "target/release/libcompressor_clap_plugin.so"
]

[track.plugins.drone]
volume = 0.7
detune_cents = 3.0
noise_mix = 0.05
attack_ms = 2000.0
decay_ms = 1000.0
sustain = 1.0
release_ms = 3000.0
filter_cutoff_hz = 90.0
filter_resonance = 0.2
lfo_rate_hz = 0.02
lfo_amount = 0.3

[track.plugins.compressor]
threshold_db = -12.0
ratio = 4.0
attack_ms = 10.0
release_ms = 50.0
makeup_gain_db = 2.0


