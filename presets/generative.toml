# ----------------------------------------------------
# TRACK 0: Generative Percussion (Ethereal & Spacey)
# ----------------------------------------------------
[[track]]
name = "Generative Drums"
midi_channel = 9
enable_live_input = false
plugin_chain = [
  "target/release/libdrum_plugin.so",
  "target/release/libreverb_test_plugin.so"
]

[track.plugins.drum]
volume = 0.6
kick_decay_ms = 600.0
snare_decay_ms = 250.0
hihat_decay_ms = 120.0
tom_decay_ms = 400.0

[track.plugins.reverb]
comb_feedback = 0.8
mix = 0.35
wet_scale = 0.2

# ----------------------------------------------------
# TRACK 1: Ambient Swells (Drifting Sine Waves)
# ----------------------------------------------------
[[track]]
name = "Ambient Swells"
midi_channel = 0
enable_live_input = false
plugin_chain = [
  "target/release/libsynth_plugin.so",
  "target/release/libdelay_clap_plugin.so",
  "target/release/libreverb_test_plugin.so"
]

[track.plugins.synth]
attack_ms = 2000.0
release_ms = 3000.0
volume = 0.01

[track.plugins.delay]
left_delay_ms = 750.0
right_delay_ms = 1000.0
feedback = 0.2
mix = 0.5

[track.plugins.reverb]
comb_feedback = 0.95
comb_dampening = 0.3
allpass_feedback = 0.6
mix = 0.8
wet_scale = 0.25

# ----------------------------------------------------
# TRACK 2: Deep Drone (Sub Bass)
# ----------------------------------------------------
[[track]]
name = "Sub Drone"
midi_channel = 1
enable_live_input = false
plugin_chain = [
  "target/release/libbass_plugin.so",
  "target/release/libcab_clap_plugin.so",
  "target/release/libvibrato_clap_plugin.so"
]

[track.plugins.bass]
waveform = 0
sub_mix = 0.8
amp_attack_ms = 3000.0
amp_decay_ms = 1000.0
amp_sustain = 1.0
amp_release_ms = 5000.0
filter_cutoff_hz = 100.0
filter_env_mod_hz = 300.0
filter_attack_ms = 4000.0
volume = 0.12

[track.plugins.cab]
low_cut_hz = 20.0
high_cut_hz = 600.0
resonance = 0.2

[track.plugins.vibrato]
rate_hz = 0.5
depth_ms = 3.5
mix = 1.0

# ----------------------------------------------------
# TRACK 3: Organic Raindrops (Generative Plucks)
# ----------------------------------------------------
[[track]]
name = "Generative Plucks"
midi_channel = 2
enable_live_input = false
plugin_chain = [
  "target/release/libbass_plugin.so",
  "target/release/libdelay_clap_plugin.so",
  "target/release/libreverb_test_plugin.so"
]

[track.plugins.bass]
waveform = 1
sub_mix = 0.0
amp_attack_ms = 5.0
amp_decay_ms = 100.0
amp_sustain = 0.0
amp_release_ms = 50.0
filter_cutoff_hz = 300.0
filter_env_mod_hz = 2500.0
filter_attack_ms = 2.0
filter_decay_ms = 120.0
volume = 0.08

[track.plugins.delay]
bpm = 85
left_delay_beats = 0.75
right_delay_beats = 1.0
feedback = 0.65
mix = 0.55

[track.plugins.reverb]
comb_feedback = 0.8
mix = 0.5
wet_scale = 0.15

