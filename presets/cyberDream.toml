[[track]]
name = "Drum Machine"
midi_channel = 9
enable_live_input = false
plugin_chain = [
  "target/release/libdrum_plugin.so"
]

[track.plugins.drum]
volume = 0.85
# Lengthened decays for a slower, boomier tempo
kick_decay_ms = 600.0
snare_decay_ms = 350.0
hihat_decay_ms = 120.0
tom_decay_ms = 450.0

[[track]]
name = "Ethereal Pad"
midi_channel = 0
enable_live_input = false
plugin_chain = [
  "target/release/libsynth_plugin.so",
  "target/release/libcompressor_clap_plugin.so",
  "target/release/libamp_clap_plugin.so",
  "target/release/libcab_clap_plugin.so",
  "target/release/libvibrato_clap_plugin.so",
  "target/release/libdelay_clap_plugin.so",
  "target/release/libreverb_test_plugin.so"
]

[track.plugins.synth]
# Slowed down into a lush pad
attack_ms = 400.0
release_ms = 800.0
volume = 0.18

[track.plugins.compressor]
threshold_db = -20.0
ratio = 3.0
attack_ms = 10.0
release_ms = 100.0
makeup_gain_db = 3.5

[track.plugins.amp]
drive = 1.5
tone = 0.6
level = 0.6

[track.plugins.cab]
low_cut_hz = 120.0
high_cut_hz = 4500.0
resonance = 0.2

[track.plugins.vibrato]
rate_hz = 2.5
depth_ms = 0.8 # Deeper, slower pitch wavering
mix = 1.0

[track.plugins.delay]
left_delay_ms = 600.0
right_delay_ms = 800.0
feedback = 0.45
mix = 0.4

[track.plugins.reverb]
comb_lengths = [1557.0, 1617.0, 1491.0, 1422.0]
allpass_lengths = [225.0, 556.0]
comb_feedback = 0.92
comb_dampening = 0.3
allpass_feedback = 0.6
left_spread = 20
right_spread = 35
mix = 0.65 # Highly washed out
wet_scale = 0.25


[[track]]
name = "Sub Drone"
midi_channel = 1
enable_live_input = false
plugin_chain = [
  "target/release/libbass_plugin.so",
  "target/release/libcompressor_clap_plugin.so",
  "target/release/libamp_clap_plugin.so",
  "target/release/libcab_clap_plugin.so"
]

[track.plugins.bass]
waveform = 0 
sub_mix = 0.8 # Heavy sub reliance
amp_attack_ms = 250.0
amp_decay_ms = 500.0
amp_sustain = 0.8
amp_release_ms = 300.0 
filter_cutoff_hz = 80.0
filter_env_mod_hz = 800.0
filter_attack_ms = 600.0 # Slow, dramatic filter sweep opening
filter_decay_ms = 400.0 
filter_sustain = 0.4
filter_release_ms = 250.0
volume = 0.12

[track.plugins.compressor]
threshold_db = -22.0
ratio = 8.0
attack_ms = 20.0
release_ms = 150.0 
makeup_gain_db = 4.0

[track.plugins.amp]
drive = 3.0
tone = 0.15
level = 0.75

[track.plugins.cab]
low_cut_hz = 30.0
high_cut_hz = 800.0
resonance = 0.5


[[track]]
name = "Polyrhythm Pluck"
midi_channel = 2
enable_live_input = false
plugin_chain = [
  "target/release/libbass_plugin.so",
  "target/release/libdelay_clap_plugin.so",
  "target/release/libreverb_test_plugin.so"
]

[track.plugins.bass]
waveform = 1 
sub_mix = 0.0 
amp_attack_ms = 1.0
amp_decay_ms = 150.0
amp_sustain = 0.0
amp_release_ms = 40.0
filter_cutoff_hz = 300.0
filter_env_mod_hz = 4000.0 
filter_attack_ms = 1.0
filter_decay_ms = 100.0 
filter_sustain = 0.0
filter_release_ms = 40.0
volume = 0.08

[track.plugins.delay]
bpm = 80 # Slowed down tempo
left_delay_beats = 0.333 # Triplet delays for complex cascading rhythms
right_delay_beats = 0.75
feedback = 0.65 
mix = 0.55

[track.plugins.reverb]
comb_lengths = [1557.0, 1617.0, 1491.0, 1422.0]
allpass_lengths = [225.0, 556.0]
comb_feedback = 0.8
comb_dampening = 0.5
allpass_feedback = 0.5
left_spread = 15
right_spread = 25
mix = 0.45 
wet_scale = 0.1
