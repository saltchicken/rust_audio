sample_rate = 48000
enable_live_input = false
latency_ms = 2.0
capacity_seconds = 1.0
plugin_chain = [
  # "target/release/libsampler_plugin.so",
  # "target/release/libsynth_plugin.so",
  "target/release/liblead_synth_plugin.so",
  "target/release/libdelay_clap_plugin.so",
  "target/release/libreverb_test_plugin.so"
]
input_device = "default"
output_device = "default"

[sampler]
# sample_path = "samples/guitar_muted.wav"
sample_path = "samples/electric_guitar_pluck.wav"
root_note = 72

[delay]
active_preset = "epic"

left_delay_ms = 400.0
right_delay_ms = 530.0
feedback = 0.65
mix = 0.5

[delay.presets.epic]
left_delay_ms = 400.0
right_delay_ms = 530.0
feedback = 0.65
mix = 0.5

[delay.presets.slapback]
left_delay_ms = 120.0
right_delay_ms = 120.0
feedback = 0.15
mix = 0.4

[delay.presets.canyon]
left_delay_ms = 800.0
right_delay_ms = 950.0
feedback = 0.85
mix = 0.6

[reverb]
active_preset = ""

comb_lengths = [1557.0, 1617.0, 1491.0, 1422.0]
allpass_lengths = [225.0, 556.0]
comb_feedback = 0.84
comb_dampening = 0.2
allpass_feedback = 0.5
left_spread = 0
right_spread = 23
mix = 0.4
wet_scale = 0.15

[reverb.presets.hall]
mix = 0.7
wet_scale = 0.25

[lead_synth]
# Mix Saw & Square (0.0 = full saw, 1.0 = full square)
osc_mix = 0.35 

# Filter properties
filter_cutoff = 150.0      # Base freq the filter rests at
filter_res = 0.82          # Resonance for squelchy leads
filter_env_amount = 5500.0 # How high the ADSR pushes the filter cutoff

# ADSR Envelope (Applies to both volume and filter)
attack_ms = 8.0            # Quick, punchy attack
decay_ms = 350.0           # Medium decay for a plucked feel
sustain_level = 0.4        # Settles to 40% volume while holding down the key
release_ms = 400.0         # Beautiful tail after letting go
